name: chat-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_local_password}
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  storage:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: chat-local
      RUSTFS_SECRET_KEY: chat-local-storage-password
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /data/logs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - attachments_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://chat:${POSTGRES_PASSWORD:-chat_local_password}@postgres:5432/chat?schema=public
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      INVITE_WEB_ORIGIN: ${INVITE_WEB_ORIGIN:-http://localhost:3000}
      MAIL_MODE: ${MAIL_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-chat@localhost.test}
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_BUCKET: chat-attachments
      S3_ACCESS_KEY: chat-local
      S3_SECRET_KEY: chat-local-storage-password
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

volumes:
  postgres_data:
  attachments_data:
